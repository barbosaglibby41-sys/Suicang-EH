name: taro_eh_flutter
description: TaroEH cross-platform manga reader migration.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5
  uuid: ^4.5.1
  taro_web_login_bridge:
    path: packages/taro_web_login_bridge
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/tag_translation_seed.json
