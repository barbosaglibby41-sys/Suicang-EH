name: suicang_eh
description: Suicang EH cross-platform manga reader.
publish_to: none
version: 0.2.0+12

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5
  uuid: ^4.5.1
  taro_web_login_bridge:
    path: packages/taro_web_login_bridge
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  file_picker: ^10.3.8
  video_player: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.1
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/suicang_eh_icon_1024.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/tag_translation_seed.json
