name: Flutter Android Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        default: v0.1.0-flutter-stable
      version:
        description: Display version
        required: true
        default: 0.1.0

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate Android host when absent
        run: test -d android || flutter create --platforms=android --project-name=taro_eh_flutter .
      - name: Set Android host compile SDK
        run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
      - name: Build ARM64 release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Verify ARM64 output
        run: |
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test ! -e build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test ! -e build/app/outputs/flutter-apk/app-x86_64-release.apk
          sha256sum build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | tee SHA256SUMS-android-arm64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: taro-eh-flutter-android-arm64-${{ inputs.version }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            SHA256SUMS-android-arm64.txt
      - name: Upload ARM64 APK to existing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            SHA256SUMS-android-arm64.txt
          overwrite_files: true
