name: Flutter Android Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        default: v0.1.8-suicang-stable
      version:
        description: Display version
        required: true
        default: 0.1.8
      source_ref:
        description: Source branch or commit to build
        required: true
        default: main

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate Android host when absent
        run: test -d android || flutter create --platforms=android --project-name=suicang_eh .
      - name: Configure Suicang EH Android host
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          sed -i '1i import java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    FileInputStream(keystorePropertiesFile).use { keystoreProperties.load(it) }\n}\n' android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          marker = 'android {'
          signing = '''android {\n    signingConfigs {\n        create("release") {\n            storeFile = file("upload-keystore.jks")\n            storePassword = keystoreProperties["storePassword"] as String?\n            keyAlias = keystoreProperties["keyAlias"] as String?\n            keyPassword = keystoreProperties["keyPassword"] as String?\n        }\n    }'''
          s = s.replace(marker, signing, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY
          sed -i 's/android:label="suicang_eh"/android:label="Suicang EH"/' android/app/src/main/AndroidManifest.xml
          # Flutter puts INTERNET in debug/profile manifests only. The
          # release APK needs it explicitly because this host is generated
          # during CI rather than committed to the repository.
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          fi
          sed -i 's/ios: true/ios: false/' pubspec.yaml
          dart run flutter_launcher_icons
      - name: Verify Android network permission
        run: grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
      - name: Build ARM64 release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Verify ARM64 output
        run: |
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test ! -e build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test ! -e build/app/outputs/flutter-apk/app-x86_64-release.apk
          sha256sum build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | tee SHA256SUMS-android-arm64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: suicang-eh-android-arm64-${{ inputs.version }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            SHA256SUMS-android-arm64.txt
      - name: Upload ARM64 APK to existing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            SHA256SUMS-android-arm64.txt
          overwrite_files: true
