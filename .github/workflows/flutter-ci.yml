name: Flutter CI

permissions:
  contents: write

on:
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'assets/**'
      - 'packages/**'
      - 'ios/**'
      - 'android/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'assets/**'
      - 'packages/**'
      - 'ios/**'
      - 'android/**'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Format Dart sources
        run: dart format lib test packages/taro_web_login_bridge/lib
      - name: Commit generated and formatted sources
        if: github.event_name == 'push'
        run: |
          git add lib test packages/taro_web_login_bridge/lib
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(flutter): format generated sources'
          git push
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test packages/taro_web_login_bridge/lib
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test

  android-arm64-release:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate Android host when absent
        run: test -d android || flutter create --platforms=android --project-name=taro_eh_flutter .
      - name: Set Android host compile SDK
        run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
      - name: Build Android ARM64 split APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Verify ARM64 APK only
        run: |
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test ! -e build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test ! -e build/app/outputs/flutter-apk/app-x86_64-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: taro-eh-flutter-arm64-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  ios-simulator:
    runs-on: macos-15
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate iOS host when absent
        run: test -d ios || flutter create --platforms=ios --project-name=taro_eh_flutter .
      - name: Install CocoaPods dependencies
        run: cd ios && pod install --repo-update
      - name: Build iOS simulator app
        run: flutter build ios --simulator --no-codesign
      - name: Upload iOS build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: taro-eh-flutter-ios-build-diagnostics
          path: |
            ios/Podfile.lock
            ios/Pods
            build/ios
          if-no-files-found: ignore
