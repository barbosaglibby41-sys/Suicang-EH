name: Diagnose Xcode Archive
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Show Xcode project list
        run: xcodebuild -list -project TaroEH.xcodeproj
      - name: Show build settings
        run: xcodebuild -project TaroEH.xcodeproj -scheme TaroEH -configuration Release -destination 'generic/platform=iOS' -showBuildSettings
      - name: Run xcodebuild archive with logs
        run: |
          mkdir -p build-diagnose
          xcodebuild archive \
            -project TaroEH.xcodeproj \
            -scheme TaroEH \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build-diagnose/TaroEH.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY='' \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-diagnose/xcodebuild-archive.log || true
      - name: Upload Xcode diagnose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-diagnose-logs
          path: |
            build-diagnose/xcodebuild-archive.log
            TaroEH.xcodeproj
            project.yml