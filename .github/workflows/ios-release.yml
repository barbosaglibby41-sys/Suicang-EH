name: iOS Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: '1.7.0'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive
        run: |
          xcodebuild archive \
            -project TaroEH.xcodeproj \
            -scheme TaroEH \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TaroEH.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY='' \
            AD_HOC_CODE_SIGNING_ALLOWED=NO
      - name: Export unsigned IPA
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamIdentifier</key>
            <string>PLACEHOLDER_TEAM</string>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          mkdir -p build/export
          xcodebuild -exportArchive \
            -archivePath build/TaroEH.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload unsigned archive and IPA container
        uses: actions/upload-artifact@v4
        with:
          name: TaroEH-${{ inputs.version }}-unsigned-build
          path: |
            build/TaroEH.xcarchive
            build/export/TaroEH.ipa

      - name: Publish unsigned IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: TaroEH v${{ inputs.version }}
          body: |
            TaroEH v${{ inputs.version }} source/build release.

            This release ships an unsigned IPA container exported via Xcode's archive export flow. It is not directly runnable on iOS. Sign it yourself with your Apple ID using AltStore, SideStore, Sideloadly, or Xcode.
          files: build/export/TaroEH.ipa
          prerelease: true

  # Signing is intentionally separate. Add an Apple certificate and provisioning
  # profile through GitHub Actions secrets before enabling this job.
  # Required secrets: IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD,
  # IOS_MOBILEPROVISION_BASE64, KEYCHAIN_PASSWORD, TEAM_ID.
