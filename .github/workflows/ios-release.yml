name: iOS Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: '1.7.14'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive
        run: |
          xcodebuild archive \
            -project TaroEH.xcodeproj \
            -scheme TaroEH \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TaroEH.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY='' \
            AD_HOC_CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA container
        run: |
          mkdir -p build/Payload
          cp -R build/TaroEH.xcarchive/Products/Applications/TaroEH.app build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/TaroEH-${{ inputs.version }}-unsigned.ipa
          unzip -t build/TaroEH-${{ inputs.version }}-unsigned.ipa

      - name: Upload unsigned archive and IPA container
        uses: actions/upload-artifact@v4
        with:
          name: TaroEH-${{ inputs.version }}-unsigned-build
          path: |
            build/TaroEH.xcarchive
            build/TaroEH-${{ inputs.version }}-unsigned.ipa

      - name: Publish unsigned IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: TaroEH v${{ inputs.version }}
          body: |
            TaroEH v${{ inputs.version }} source/build release.

            The attached IPA is an unsigned IPA container. It is not directly runnable on iOS. Download the actual .ipa file to Files, then re-sign it with your Apple ID using SideStore, AltStore, Sideloadly, or Xcode.
          files: build/TaroEH-${{ inputs.version }}-unsigned.ipa
          overwrite_files: true
          prerelease: true

  # Signing is intentionally separate. Add an Apple certificate and provisioning
  # profile through GitHub Actions secrets before enabling this job.
  # Required secrets: IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD,
  # IOS_MOBILEPROVISION_BASE64, KEYCHAIN_PASSWORD, TEAM_ID.
